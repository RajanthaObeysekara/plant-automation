services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantapp}
      POSTGRES_DB: ${POSTGRES_DB:-plantapp}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-plantapp}:${POSTGRES_PASSWORD:-plantapp}@db:5432/${POSTGRES_DB:-plantapp}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      DEMO_DEVICE_KEY: ${DEMO_DEVICE_KEY:-dev-unit-1-key}
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8090:80"

  # Plays every ESP32 controller in the fleet, in one process: a room
  # controller per greenhouse (shared env sensor + misting) and a farm
  # controller per site (shared water tank + fertigation rig). Sensor
  # baselines track real current weather at each farm's location.
  simulator:
    build: ./simulator
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
      DATABASE_URL: postgres://${POSTGRES_USER:-plantapp}:${POSTGRES_PASSWORD:-plantapp}@db:5432/${POSTGRES_DB:-plantapp}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  db_data:
