services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantapp}
      POSTGRES_DB: ${POSTGRES_DB:-plantapp}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-plantapp}:${POSTGRES_PASSWORD:-plantapp}@db:5432/${POSTGRES_DB:-plantapp}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      DEMO_DEVICE_KEY: ${DEMO_DEVICE_KEY:-dev-unit-1-key}
      # Real ESP32 hardware talks to this over MQTT (a cloud broker, not
      # this LAN) instead of polling the REST device API — see
      # backend/src/mqtt.js. Unset in an environment with no broker and the
      # bridge just stays disabled; the REST API (used by the simulator)
      # is unaffected either way.
      MQTT_URL: ${MQTT_URL:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      PORT: "4000"
      # Without this, Node's Date "local" methods (getDay/getHours/etc, used
      # throughout planner.js) run in the container's default UTC — Sri
      # Lanka is UTC+5:30, so "today"/"is it daytime" would silently be
      # wrong for the last ~5.5h of every UTC day. This farm only ever
      # operates in one timezone; hardcoding it here is correct, not a
      # shortcut.
      TZ: Asia/Colombo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8090:80"

  # Plays every ESP32 controller in the fleet, in one process: a room
  # controller per greenhouse (shared env sensor + misting) and a farm
  # controller per site (shared water tank + fertigation rig). Sensor
  # baselines track real current weather at each farm's location.
  simulator:
    build: ./simulator
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
      DATABASE_URL: postgres://${POSTGRES_USER:-plantapp}:${POSTGRES_PASSWORD:-plantapp}@db:5432/${POSTGRES_DB:-plantapp}
      # See the backend service's TZ comment — same bug, same fix, for
      # rules.js's isDaytime/feedPhase/fungicideDue day-of-week math.
      TZ: Asia/Colombo
      # Rooms/farms a real physical unit now drives — comma-separated
      # device_keys the simulator must never touch. dev-unit-1-key is
      # Greenhouse Room 1's own device; dev-unit-1-key-farm is Kadawatha
      # Farm's *separate* farm-device key — easy to miss since the room
      # and farm are different devices in the data model even though one
      # physical board (bench-wired with the farm's tank float switches)
      # reports both. Leaving the farm key off this list let the simulator
      # keep posting fake tank telemetry for Kadawatha Farm, racing against
      # and periodically overwriting the room's real sensor readings —
      # exactly the "OLED says one thing, dashboard says another" bug this
      # fixes.
      EXCLUDE_DEVICE_KEYS: ${EXCLUDE_DEVICE_KEYS:-dev-unit-1-key,dev-unit-1-key-farm}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  db_data:
