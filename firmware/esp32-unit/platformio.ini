; One firmware image for every board. Per-board identity (device key,
; WiFi/MQTT credentials, whether the tank float switches are wired) lives
; in NVS - written once over USB by tools/provision.py - never in this
; build, because the image is published publicly for OTA updates.
;
; FW_VERSION: set by CI from the release tag (FW_VERSION=1.4.2 pio run);
; local builds leave it empty and report "0.0.0-dev".
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Two 1.875MB OTA slots (was 2x1.25MB): room for the firmware to grow
; (e.g. a larger TFT UI) while keeping OTA's spare slot. NVS stays at the
; same offset, so stored secrets/calibration survive the switch.
board_build.partitions = min_spiffs.csv
lib_deps =
	bblanchon/ArduinoJson @ ^7.2.0
	adafruit/DHT sensor library @ ^1.4.6
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	adafruit/Adafruit SSD1331 OLED Driver Library for Arduino @ ^1.2.0
	adafruit/Adafruit GFX Library @ ^1.11.10
	adafruit/Adafruit BusIO @ ^1.16.1
	knolleary/PubSubClient @ ^2.8
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DFW_VERSION='"${sysenv.FW_VERSION}"'
	; PubSubClient's default 256-byte packet cap is far too small for the
	; retained /config payload (schedule + 7-day plan, easily 1-1.5KB of
	; JSON) — must be set before the library compiles, hence a build flag
	; rather than a runtime call.
	-DMQTT_MAX_PACKET_SIZE=4096

[platformio]
default_envs = esp32dev
